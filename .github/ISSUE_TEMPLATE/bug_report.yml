name: Bug report
description: Report a reproducible Basalt problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the action you took and what Basalt showed.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPad Pro M2, iPadOS 18.5
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quantization
      placeholder: Model name, architecture, Q4_K_M
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true

